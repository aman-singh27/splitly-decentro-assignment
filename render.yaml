# Free assignment demo. Local SQLite and photos reset on restart/redeploy/idle.
# For durable data, choose a paid service and attach a disk before accepting data.
services:
  - type: web
    name: splitly-decentro
    runtime: docker
    repo: https://github.com/aman-singh27/splitly-decentro-assignment
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health/ready
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_HTTPS
        value: "true"
      - key: DJANGO_SECURE_COOKIES
        value: "true"
      - key: SQLITE_PATH
        value: /app/data/db.sqlite3
      - key: MEDIA_ROOT
        value: /app/data/receipts
