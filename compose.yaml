services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your shell or .env}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      SQLITE_PATH: "/app/data/splitly.sqlite3"
      # Local HTTP demo only. Use secure cookies behind HTTPS deployment.
      DJANGO_SECURE_COOKIES: "false"
      DJANGO_HTTPS: "false"
      MEDIA_ROOT: "/app/data/receipts"
    volumes:
      - splitly-data:/app/data
    restart: unless-stopped

volumes:
  splitly-data:
